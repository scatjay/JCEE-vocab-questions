<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>練習系統（建置中） · 高中英文題庫</title>
<meta name="robots" content="noindex">
<style>
  :root{ --paper:#F6F1E4; --paper-card:#FFFDF7; --ink:#221F1A; --ink-soft:#5B5648; --rule:#DCD3BB; --sage:#3E6E52; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
       min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{max-width:440px; text-align:center; background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:32px 28px;}
  h1{font-size:19px; margin:0 0 10px;}
  p{font-size:14px; line-height:1.8; color:var(--ink-soft);}
  .badge{display:inline-block; background:var(--sage); color:#fff; font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; margin-bottom:14px;}
</style>
</head>
<body>
<div class="card">
  <div class="badge">審核已通過</div>
  <h1>遊戲化練習系統，建置中</h1>
  <p>登入與審核閘門已經完成。番茄鐘衝刺、碎片時間快速練習、XP／連續紀錄、AI 個人化家教建議，都還在設計與建置階段，會陸續加上來。</p>
  <p><a href="../gate/login.html">← 回登入頁</a></p>
</div>
</body>
</html>
