<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>審核後台 · 高中英文題庫（測試版）</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --paper:#F6F1E4; --paper-card:#FFFDF7; --ink:#221F1A; --ink-soft:#5B5648;
    --rule:#DCD3BB; --crimson:#AE3626; --sage:#3E6E52;
    --shadow: 0 1px 0 rgba(34,31,26,.06), 0 8px 24px rgba(34,31,26,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;}
  .wrap{max-width:720px; margin:0 auto; padding:32px 20px 60px;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{font-size:13px; color:var(--ink-soft); margin:0 0 24px;}
  .gate{max-width:420px; margin:60px auto; text-align:center; background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:28px;}
  .btn{padding:10px 20px; border-radius:6px; border:1px solid var(--rule); background:#fff; font-size:14px; font-weight:700; cursor:pointer;}
  .row{
    display:flex; align-items:center; gap:12px; background:var(--paper-card); border:1px solid var(--rule);
    border-radius:6px; padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow);
  }
  .row img{width:36px; height:36px; border-radius:50%; flex-shrink:0; background:var(--rule);}
  .row .info{flex:1; min-width:0;}
  .row .name{font-weight:700; font-size:14.5px;}
  .row .email{font-size:12.5px; color:var(--ink-soft);}
  .row .when{font-size:11.5px; color:var(--ink-soft);}
  .approve-btn{background:var(--sage); color:#fff; border:none; border-radius:5px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; flex-shrink:0;}
  .approve-btn:disabled{background:var(--rule); color:var(--ink-soft); cursor:default;}
  .tag-approved{font-size:11.5px; color:var(--sage); font-weight:700; flex-shrink:0;}
  .section-title{font-size:14px; font-weight:700; margin:26px 0 10px; color:var(--ink-soft);}
  .empty{font-size:13px; color:var(--ink-soft); padding:14px 0;}
  .denied{max-width:420px; margin:60px auto; text-align:center; color:var(--crimson); font-size:14px;}
</style>
</head>
<body>
<div id="gateBox" class="gate">
  <p>審核後台，僅限楊老師本人登入。</p>
  <button class="btn" id="loginBtn">使用 Google 帳號登入</button>
</div>

<div id="deniedBox" class="denied" style="display:none;">
  這個帳號沒有審核權限。
</div>

<div id="appWrap" class="wrap" style="display:none;">
  <h1>學員審核後台</h1>
  <p class="sub">高中英文題庫（測試版）— 只有這裡通過審核，學員才能進入練習系統。</p>

  <div class="section-title">待審核</div>
  <div id="pendingList"><div class="empty">目前沒有待審核的登入。</div></div>

  <div class="section-title">已核准</div>
  <div id="approvedList"><div class="empty">目前沒有已核准的帳號。</div></div>
</div>

<script type="module">
  import { loginWithGoogle, watchAuth, isAdmin, watchAllUsers, approveUser } from "./gate-config.js";

  document.getElementById("loginBtn").addEventListener("click", () => loginWithGoogle().catch(e => alert(e.message)));

  function rowHtml(uid, u, approved) {
    const when = u.requestedAt ? new Date(u.requestedAt).toLocaleString("zh-TW") : "";
    const avatar = u.photoURL ? `<img src="${u.photoURL}" alt="">` : `<img alt="">`;
    return `<div class="row" data-uid="${uid}">
      ${avatar}
      <div class="info">
        <div class="name">${u.displayName || "(未提供姓名)"}</div>
        <div class="email">${u.email || ""}</div>
        <div class="when">${approved ? "核准於 " + (u.approvedAt ? new Date(u.approvedAt).toLocaleString("zh-TW") : "") : "申請於 " + when}</div>
      </div>
      ${approved ? '<span class="tag-approved">已核准 ✓</span>' : '<button class="approve-btn">核准</button>'}
    </div>`;
  }

  function render(users) {
    const pending = [], approved = [];
    Object.entries(users).forEach(([uid, u]) => {
      (u.approved ? approved : pending).push([uid, u]);
    });
    pending.sort((a, b) => (a[1].requestedAt || 0) - (b[1].requestedAt || 0));
    approved.sort((a, b) => (b[1].approvedAt || 0) - (a[1].approvedAt || 0));

    const pendingEl = document.getElementById("pendingList");
    const approvedEl = document.getElementById("approvedList");
    pendingEl.innerHTML = pending.length ? pending.map(([uid, u]) => rowHtml(uid, u, false)).join("") : '<div class="empty">目前沒有待審核的登入。</div>';
    approvedEl.innerHTML = approved.length ? approved.map(([uid, u]) => rowHtml(uid, u, true)).join("") : '<div class="empty">目前沒有已核准的帳號。</div>';

    pendingEl.querySelectorAll(".approve-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "處理中…";
        const uid = btn.closest(".row").dataset.uid;
        try {
          await approveUser(uid);
        } catch (e) {
          alert("核准失敗：" + e.message);
          btn.disabled = false;
          btn.textContent = "核准";
        }
      });
    });
  }

  watchAuth((user) => {
    const gateBox = document.getElementById("gateBox");
    const deniedBox = document.getElementById("deniedBox");
    const appWrap = document.getElementById("appWrap");
    if (!user) {
      gateBox.style.display = "block";
      deniedBox.style.display = "none";
      appWrap.style.display = "none";
      return;
    }
    if (!isAdmin(user)) {
      gateBox.style.display = "none";
      deniedBox.style.display = "block";
      appWrap.style.display = "none";
      return;
    }
    gateBox.style.display = "none";
    deniedBox.style.display = "none";
    appWrap.style.display = "block";
    watchAllUsers(render);
  });
</script>
</body>
</html>
